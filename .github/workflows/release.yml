name: Release

# Publishes the version in Cargo.toml to crates.io and creates the GitHub
# release, with the matching CHANGELOG section as its notes. Run it by
# pushing a `v<version>` tag, or from the Actions tab on `main` (which also
# creates the tag). A manual run is a dry run unless you untick the box.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check and package only; don't publish, tag, or release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check version, tag, and crates.io
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == branch && "$DRY_RUN" != true ]]; then
            if [[ "$GITHUB_REF_NAME" != main ]]; then
              echo "::error::Release from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if [[ -n "$(git ls-remote --tags origin "v$version")" ]]; then
              echo "::error::Tag v$version already exists; push it to release, or bump the version"
              exit 1
            fi
          fi

          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "speech-prep release workflow (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/speech-prep/$version")
          if [[ "$status" == 200 ]]; then
            echo "::error::speech-prep $version is already on crates.io"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^(## \[|\[[^]]+\]: )/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          # Re-running this job replaces the notes from the earlier attempt.
          overwrite: true

      - run: cargo test
      - run: cargo test --features opus
      - run: cargo publish --dry-run

  publish:
    name: Publish
    needs: check
    if: github.event_name == 'push' || !inputs.dry-run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      # Trusted publishing: crates.io trusts this workflow, so no API token
      # is stored in the repository.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Skipped when the version is already up, so a failed release step can
      # be re-run.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "speech-prep release workflow (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/speech-prep/$VERSION")
          if [[ "$status" == 200 ]]; then
            echo "speech-prep $VERSION is already on crates.io"
          else
            cargo publish
          fi

      # Creates the tag at this commit when it doesn't exist yet.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md
