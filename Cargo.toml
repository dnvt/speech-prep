[package]
name = "speech-prep"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Speech audio preprocessing: decoding to 16 kHz mono, voice activity detection, chunking, and noise reduction"
documentation = "https://docs.rs/speech-prep"
repository = "https://github.com/dnvt/speech-prep"
readme = "README.md"
keywords = ["speech", "audio", "vad", "preprocessing", "voice"]
categories = ["multimedia::audio", "science"]
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "src/**",
    "examples/**",
    "tests/**",
    "benches/**",
]

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "adpcm", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav", "aiff", "caf"] }
symphonia-adapter-opus-rs = { version = "0.1", optional = true }
realfft = "3.5"
tracing = "0.1"
thiserror = "2"

[features]
# Opus decoding with a pure-Rust decoder (ruopus). Off by default: it adds
# about 20 crates and its dependencies need Rust 1.95.
opus = ["dep:symphonia-adapter-opus-rs"]

[dev-dependencies]
hound = "3"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "throughput"
harness = false
