[package]
name = "speech-prep"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Speech audio preprocessing: decoding to 16 kHz mono, voice activity detection, chunking, and noise reduction"
documentation = "https://docs.rs/speech-prep"
repository = "https://github.com/dnvt/speech-prep"
readme = "README.md"
keywords = ["speech", "audio", "vad", "preprocessing", "voice"]
categories = ["multimedia::audio", "science"]
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**",
    "examples/**",
    "tests/**",
    "benches/**",
]

[dependencies]
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
realfft = "3.5"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
hound = "3"

[[bench]]
name = "throughput"
harness = false
